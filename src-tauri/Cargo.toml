[package]
name = "detent"
description = "Detent: HOTAS configuration tool with in-game overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "detent_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
detent-core.workspace = true
detent-input.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
# Opens the Discord Developer Portal in the default browser (setup guide).
tauri-plugin-opener = "2"
# Discord token endpoint (HTTPS, rustls).
ureq = "2"
# A second launch shows the running instance instead of starting another one.
tauri-plugin-single-instance = "2"
# One-time "keeps running in the tray" notification; used from Rust only.
tauri-plugin-notification = "2"
# "Play sound file" actions (wav, mp3, ogg, flac).
rodio = { version = "0.23", default-features = false, features = ["playback", "flac", "mp3", "vorbis", "wav"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# COM APIs: speech (SAPI) and Windows audio volume (Core Audio).
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
]

# Client secret and OAuth tokens in the Windows Credential Manager.
[target.'cfg(windows)'.dependencies.keyring]
version = "3"
features = ["windows-native"]
