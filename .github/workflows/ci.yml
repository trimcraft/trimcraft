name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Trimcraft currently builds and runs on Windows 10/11. The gate and the release build run as
# two parallel jobs: they share no compiled code (debug and test profiles vs. release), so
# running them one after the other only added up their times.
#
# Build caches (Swatinem/rust-cache) are saved only from main; pull requests and other
# branches restore main's. One entry is over a gigabyte and the repository has 10 GB, so
# per-branch entries would push main's out.
jobs:
  checks:
    name: checks
    runs-on: windows-latest
    env:
      # Line tables are enough for test backtraces; full debug info only makes the debug and
      # test builds slower and the cache bigger.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Same gate as scripts/check.sh: npm ci, svelte-check, frontend build, cargo fmt,
      # clippy -D warnings and tests for the whole workspace (trimcraft-core included).
      - name: Checks
        shell: bash
        run: ./scripts/check.sh

  build:
    name: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      # The release workflow restores this cache (same shared key) for builds that are not
      # signed through SignPath, so a tag build only recompiles what changed since main's last
      # CI run. Keep the cargo environment of this job and the release job identical, or the
      # keys differ.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-build
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build app
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trimcraft-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/trimcraft.exe
          if-no-files-found: error
