name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
          - name: macos
            os: macos-latest
            bundles: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Same gate as scripts/check.sh (bash on both runners).
      - name: Checks
        shell: bash
        run: ./scripts/check.sh

      - name: Build app
        shell: bash
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload Windows installer
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: detent-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/detent.exe
          if-no-files-found: error

      - name: Upload macOS app
        if: matrix.name == 'macos'
        shell: bash
        run: |
          cd target/release/bundle/macos
          ditto -c -k --keepParent Detent.app "$GITHUB_WORKSPACE/Detent-macos.zip"

      - name: Upload macOS artifact
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: detent-macos
          path: Detent-macos.zip
          if-no-files-found: error
