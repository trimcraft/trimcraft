[workspace]
resolver = "3"
members = ["crates/trimcraft-core", "crates/trimcraft-input", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/trimcraft/trimcraft"
rust-version = "1.90"

[workspace.dependencies]
trimcraft-core = { path = "crates/trimcraft-core" }
trimcraft-input = { path = "crates/trimcraft-input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
