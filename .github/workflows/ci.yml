name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Trimcraft supports Windows 10/11 only.
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Same gate as scripts/check.sh: npm ci, svelte-check, frontend build, cargo fmt,
      # clippy -D warnings and tests for the whole workspace (trimcraft-core included).
      - name: Checks
        shell: bash
        run: ./scripts/check.sh

      - name: Build app
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: trimcraft-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/trimcraft.exe
          if-no-files-found: error
